      <stop offset="0" stop-color="#261D11"/>
      <stop offset="1" stop-color="#120E08"/>
    </linearGradient>
    <path id="tri" d="M12.06 4.40 19.94 4.40 19.36 5.80 12.64 5.80ZM13.06 6.80 18.94 6.80 18.36 8.20 13.64 8.20Z"/>
  </defs>
  <rect x="1.5" y="2.3" width="29" height="29" rx="6" fill="#000" fill-opacity=".35"/>
  <rect x="1.5" y="1.5" width="29" height="29" rx="6" fill="url(#stone)"/>
  <g fill="#F0BE50">
